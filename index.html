<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 id="homeHeader">HOME</h3>
                <div class="score">
                    <h2 id="homeScore" >00</h2>
                </div>
                <div class="btnArea" id="homeButtonArea">
                    <button class="scoreBtn" id="home1" value="1">+1</button>
                    <button class="scoreBtn" id="home2" value="2">+2</button>
                    <button class="scoreBtn" id="home3" value="3">+3</button>
                </div>
             </div>   
            <div>
                <h3 id="awayHeader">AWAY</h3>
                    <div class="score">
                    <h2 id="awayScore">00</h2>
                    </div>
                <div class="btnArea" id="awayButtonArea">
                    <button class="scoreBtn" id="away1" value="1">+1</button>
                    <button class="scoreBtn" id="away2" value="2">+2</button>
                    <button class="scoreBtn" id="away3" value="3">+3</button>
                </div>
            </div>
          </div>
          <button id="newGame">New Game</button>
        
        
        
       
        <script src="index.js"></script>
    </body>
</html>
